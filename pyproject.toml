[project]
name = "bar"
version = "0.1.0"
description = "An agent runtime that enforces its own limits, and a chaos suite that proves it."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115", "uvicorn[standard]>=0.32",
    "pydantic>=2.9", "pydantic-settings>=2.6", "httpx>=0.28",
    "anthropic>=0.40", "rich>=13.9", "typer>=0.15",
    # imported by src/bar/llm.py for retry/backoff on model calls. It was
    # missing, so `make install` followed by `make demo` crashed with
    # ModuleNotFoundError on a clean checkout.
    "tenacity>=9.0",
]

[project.scripts]
bar = "bar.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]
ui  = ["streamlit>=1.40", "pandas>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bar"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
