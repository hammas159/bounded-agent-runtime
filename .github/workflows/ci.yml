name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  containment:
    # The whole point of the project. No model, no network, no database - the suite
    # replaces the agent with something guaranteed to misbehave and asserts the
    # runtime stops it. Milliseconds, so it runs on every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --all-groups
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - name: Containment suite
        run: uv run pytest -q -v
